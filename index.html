<div class="note">

<b>重要说明：</b>

<br><br>

官方平均值是长期中心，不是固定保底。

<br><br>

程序会从相邻历史 SP 的：

「上一轮偏离 → 下一轮偏离」

计算是否真的存在反向关系。

<br><br>

如果样本不足或关系很弱，
系统会自动降低拉长补短的权重。

<br><br>

这里输出的是统计模型，
不是保证某一抽一定出 SP。

<script>

(function(){

"use strict";


/* =========================
   基础函数
========================= */

const $ =
id =>
document.getElementById(id);


const clamp =
(x,a,b) =>
Math.max(
    a,
    Math.min(b,x)
);


const fmt =
x =>
Number.isInteger(x)
?
String(x)
:
String(
    Math.round(x*10)/10
);


/* =========================
   读取历史数据
========================= */

function getData(){

    return $("history")
        .value
        .trim()
        .split(
            /[\s,，、;；]+/
        )
        .map(Number)
        .filter(
            x =>
            Number.isFinite(x)
            &&
            x>0
        );

}


/* =========================
   平均值
========================= */

function mean(a){

    if(!a.length)
        return 0;

    return a.reduce(
        (s,x)=>s+x,
        0
    ) / a.length;

}


/* =========================
   中位数
========================= */

function median(a){

    if(!a.length)
        return 0;

    const b =
        [...a].sort(
            (x,y)=>x-y
        );

    const n =
        b.length;

    if(n%2){

        return b[
            (n-1)/2
        ];

    }

    return (
        b[n/2-1]
        +
        b[n/2]
    )/2;

}


/* =========================
   标准差
========================= */

function sd(a){

    if(a.length<2)
        return 0;

    const m =
        mean(a);

    return Math.sqrt(

        a.reduce(
            (s,x)=>
            s+
            Math.pow(
                x-m,
                2
            ),
            0
        )
        /
        (a.length-1)

    );

}


/* =========================
   拉长补短分析
========================= */

function reversalStats(
    history,
    official
){

    const deviations =
        history.map(
            x =>
            x-official
        );


    /*
    至少需要几次数据
    才能分析相邻关系
    */

    if(
        deviations.length<4
    ){

        return {

            n:0,

            corr:0,

            slope:0,

            confidence:0,

            label:
            "样本不足",

            comp:0

        };

    }


    /*
    X = 上一轮偏离

    Y = 下一轮偏离
    */

    const x =
        deviations.slice(
            0,-1
        );


    const y =
        deviations.slice(
            1
        );


    const mx =
        mean(x);


    const my =
        mean(y);


    let numerator=0;

    let dx=0;

    let dy=0;


    for(
        let i=0;
        i<x.length;
        i++
    ){

        const a =
            x[i]-mx;

        const b =
            y[i]-my;


        numerator +=
            a*b;


        dx +=
            a*a;


        dy +=
            b*b;

    }


    /*
    Pearson 相关系数

    负数：

    长 → 短
    短 → 长
    */

    const corr =
        (
            dx &&
            dy
        )
        ?
        numerator /
        Math.sqrt(
            dx*dy
        )
        :
        0;


    /*
    回归斜率

    Y = slope * X + intercept
    */

    const slope =
        dx
        ?
        numerator/dx
        :
        0;


    /*
    样本越多
    越相信这个规律

    50 次以后接近满权重
    */

    const sampleFactor =
        clamp(
            (
                deviations.length-3
            )/47,
            0,
            1
        );


    /*
    相关性越负
    拉长补短证据越强
    */

    const effect =
        clamp(
            (
                -corr-0.05
            )/0.65,
            0,
            1
        );


    const strength =
        sampleFactor*
        effect;


    /*
    补偿系数

    限制最大 ±80%
    防止模型过度修正
    */

    const comp =
        clamp(
            -slope,
            -0.8,
            0.8
        );


    let label =
        "无明显关系";


    if(
        deviations.length<8
    ){

        label=
            "样本不足";

    }

    else if(
        corr<=-0.45
        &&
        strength>=0.45
    ){

        label=
            "强";

    }

    else if(
        corr<=-0.25
        &&
        strength>=0.22
    ){

        label=
            "中";

    }

    else if(
        corr<-0.10
    ){

        label=
            "弱";

    }


    return {

        n:
        deviations.length,

        corr,

        slope,

        confidence:
        strength,

        label,

        comp

    };

}


/* =========================
   官方理论模型
========================= */

function baseSurvival(
    history,
    x,
    official
){

    /*
    官方平均抽数
    作为指数分布中心
    */

    const officialSurvival =
        Math.exp(
            -Math.max(
                0,
                x
            )
            /
            official
        );


    if(
        history.length<3
    ){

        return officialSurvival;

    }


    /*
    历史经验生存概率
    */

    let greater=0;


    for(
        const v of history
    ){

        if(v>x)
            greater++;

    }


    const empirical =
        (
            greater+1
        )
        /
        (
            history.length+2
        );


    /*
    历史数据权重

    数据越多
    历史权重越高
    */

    const weight =
        history.length
        /
        (
            history.length+20
        );


    return (

        (
            1-weight
        )
        *
        officialSurvival

        +

        weight*
        empirical

    );

}


/* =========================
   拉长补短后的中心
========================= */

function adjustedCenter(
    history,
    current,
    official,
    reversal
){

    /*
    没有足够证据
    不调整
    */

    if(
        reversal.n<4
        ||
        reversal.confidence<=0
    ){

        return official;

    }


    /*
    当前偏离

    例如：

    当前 600
    官方 313

    偏离 +287
    */

    const currentDeviation =
        current-official;


    /*
    拉长补短：

    当前偏长
    → 下一轮倾向偏短

    当前偏短
    → 下一轮倾向偏长
    */

    const predictedDeviation =
        -reversal.comp*
        currentDeviation;


    /*
    根据证据强度
    决定实际调整多少
    */

    const shift =
        predictedDeviation*
        reversal.confidence;


    /*
    防止模型跑得太极端

    中心最多：

    25% ～ 250%
    的官方平均
    */

    return clamp(

        official+shift,

        official*0.25,

        official*2.5

    );

}


/* =========================
   生存概率
========================= */

function survival(
    history,
    x,
    official,
    center
){

    /*
    调整后的理论中心
    */

    const theoretical =
        Math.exp(
            -Math.max(
                0,
                x
            )
            /
            center
        );


    if(
        history.length<3
    ){

        return theoretical;

    }


    /*
    历史经验
    */

    let greater=0;


    for(
        const v of history
    ){

        if(v>x)
            greater++;

    }


    const empirical =
        (
            greater+1
        )
        /
        (
            history.length+2
        );


    /*
    官方/历史混合
    */

    const weight =
        history.length
        /
        (
            history.length+20
        );


    return (

        (
            1-weight
        )
        *
        theoretical

        +

        weight*
        empirical

    );

}


/* =========================
   条件概率
========================= */

function conditionalProbability(
    history,
    current,
    remaining,
    official,
    center
){

    /*
    已经抽到 current
    仍然没有 SP

    求未来 remaining 抽
    出 SP 的概率
    */

    const before =
        Math.max(
            0.000000000001,

            survival(
                history,
                current,
                official,
                center
            )
        );


    const after =
        survival(
            history,
            current+remaining,
            official,
            center
        );


    return clamp(

        1-
        after/before,

        0,

        1

    );

}


/* =========================
   50 / 80 / 90 分位
========================= */

function quantile(
    history,
    current,
    q,
    official,
    center
){

    let low=0;


    let high =
        Math.max(
            1000,
            official*8,
            center*8
        );


    /*
    找到上界
    */

    while(

        conditionalProbability(
            history,
            current,
            high,
            official,
            center
        )
        <
        q

    ){

        high*=2;

    }


    /*
    二分搜索
    */

    for(
        let i=0;
        i<55;
        i++
    ){

        const mid =
            (low+high)/2;


        if(

            conditionalProbability(
                history,
                current,
                mid,
                official,
                center
            )
            >=
            q

        ){

            high=mid;

        }

        else{

            low=mid;

        }

    }


    return Math.ceil(high);

}


/* =========================
   统计卡片
========================= */

function stat(
    title,
    value
){

    return `

    <div class="stat">

        <div class="st">
            ${title}
        </div>

        <div class="sv">
            ${value}
        </div>

    </div>

    `;

}


/* =========================
   主分析
========================= */

function analyze(){

    const history =
        getData();


    const official =
        Number(
            $("official").value
        );


    const current =
        Number(
            $("current").value
        );


    $("status").className=
        "muted status";


    /* 官方设定 */

    if(
        !Number.isFinite(
            official
        )
        ||
        official<=0
    ){

        $("status").textContent=
            "❌ 官方平均抽数无效";

        $("status").className=
            "muted status bad";

        return;

    }


    /* 当前抽数 */

    if(
        !Number.isFinite(
            current
        )
        ||
        current<0
    ){

        $("status").textContent=
            "❌ 当前抽数无效";

        $("status").className=
            "muted status bad";

        return;

    }


    /* 历史 */

    if(!history.length){

        $("status").textContent=
            "❌ 至少输入 1 个真实 SP 历史数据";

        $("status").className=
            "muted status bad";

        return;

    }


    /*
    排序只是用于
    统计显示

    拉长补短分析仍然使用
    用户输入的时间顺序
    */

    const sorted =
        [...history].sort(
            (a,b)=>a-b
        );


    const average =
        mean(sorted);


    const med =
        median(sorted);


    const deviationSD =
        sd(sorted);


    /*
    拉长补短
    */

    const reversal =
        reversalStats(
            history,
            official
        );


    /*
    当前情况下
    调整后的中心
    */

    const center =
        adjustedCenter(
            history,
            current,
            official,
            reversal
        );


    /*
    预测
    */

    const q50 =
        quantile(
            history,
            current,
            0.50,
            official,
            center
        );


    const q80 =
        quantile(
            history,
            current,
            0.80,
            official,
            center
        );


    const q90 =
        quantile(
            history,
            current,
            0.90,
            official,
            center
        );


    $("prediction").textContent=
        `未来约 ${q50} 抽`;


    $("prediction2").textContent=

        `50%分位 · `+

        `80%：未来 ${q80} 抽 · `+

        `90%：未来 ${q90} 抽 · `+

        `调整中心约 ${fmt(center)} 抽`;


    /* =====================
       核心统计
    ===================== */

    $("stats").innerHTML=

        stat(
            "官方平均",
            fmt(official)+" 抽"
        )

        +

        stat(
            "历史样本",
            history.length+" 次"
        )

        +

        stat(
            "历史平均",
            fmt(average)+" 抽"
        )

        +

        stat(
            "历史中位数",
            fmt(med)+" 抽"
        )

        +

        stat(
            "历史波动 SD",
            fmt(deviationSD)+" 抽"
        )

        +

        stat(
            "模型中心",
            fmt(center)+" 抽"
        );


    /* =====================
       拉长补短显示
    ===================== */

    const corrText =
        reversal.n
        ?
        reversal.corr.toFixed(3)
        :
        "—";


    const compText =
        reversal.n
        ?
        (
            reversal.comp*100
        ).toFixed(1)+"%"
        :
        "—";


    let direction =
        "—";


    if(
        reversal.n
    ){

        if(
            reversal.comp>0.05
        ){

            direction=
                "有反向修正倾向";

        }

        else if(
            reversal.comp<-0.05
        ){

            direction=
                "没有稳定的反向修正";

        }

        else{

            direction=
                "接近随机 / 不明显";

        }

    }


    $("reversal").innerHTML=

        `<b>
        拉长补短强度：
        ${reversal.label}
        </b>

        <br><br>

        相邻偏离相关系数：

        ${corrText}

        <br>

        估计反向补偿系数：

        ${compText}

        <br>

        当前模型判断：

        ${direction}

        <br><br>

        <span class="muted">

        样本越多，
        系统才会越相信这个关系。

        样本少时会自动降低影响。

        </span>`;


    /* =====================
       条件概率
    ===================== */

    const probabilityList=[

        50,

        100,

        150,

        200,

        300

    ].map(
        x => [

            x,

            conditionalProbability(
                history,
                current,
                x,
                official,
                center
            )

        ]
    );


    $("prob").innerHTML=

        probabilityList
        .map(
            ([x,p]) =>

            `未来 ${x} 抽内：

            <b>
            ${(p*100).toFixed(1)}%
            </b>`

        )
        .join("<br>");


    /* =====================
       区间图
    ===================== */

    $("ranges").innerHTML=

        probabilityList
        .map(
            ([x,p]) => `

            <div class="range">

                <b>
                未来 ${x} 抽内
                </b>

                ：

                ${(p*100).toFixed(1)}%

                <div class="bar">

                    <div
                    class="fill"
                    style="
                    width:
                    ${(p*100).toFixed(1)}%
                    "
                    ></div>

                </div>

            </div>

            `
        )
        .join("");


    /* =====================
       当前状态
    ===================== */

    const deviation =
        current-official;


    let state=
        "正常";


    if(
        deviation
        >
        official*0.35
    ){

        state=
            "明显偏长";

    }

    else if(
        deviation
        >
        official*0.12
    ){

        state=
            "偏长";

    }

    else if(
        deviation
        <
        -official*0.35
    ){

        state=
            "明显偏短";

    }

    else if(
        deviation
        <
        -official*0.12
    ){

        state=
            "偏短";

    }


    $("state").innerHTML=

        `<b>
        ${state}
        </b>

        <br><br>

        当前偏离官方中心：

        ${
            deviation>=0
            ?
            "+"
            :
            ""
        }

        ${fmt(deviation)}
        抽

        <br>

        当前抽数：

        ${fmt(current)}

        ｜

        官方平均：

        ${fmt(official)}

        <br><br>

        ${
            reversal.n>=4
            &&
            reversal.comp>0.05
            ?

            "模型会根据历史反向关系，对下一轮中心做适度回补。"

            :

            "目前没有足够强的历史证据让拉长补短大幅改变预测。"

        }`;


    /* =====================
       最近历史
    ===================== */

    const recent =
        history
        .slice(-15)
        .reverse();


    $("table").innerHTML=

        `

        <table>

        <tr>

        <th>
        最近
        </th>

        <th>
        SP出现抽数
        </th>

        <th>
        相对官方
        </th>

        </tr>


        ${

        recent
        .map(
            (v,i)=>{

                const d =
                    v-official;


                return `

                <tr>

                <td>
                ${i+1}
                </td>

                <td>
                ${fmt(v)} 抽
                </td>

                <td>

                ${
                    d>=0
                    ?
                    "+"
                    :
                    ""
                }

                ${fmt(d)}

                </td>

                </tr>

                `;

            }
        )
        .join("")

        }

        </table>

        `;


    /* =====================
       完成
    ===================== */

    $("status").textContent=

        `✓ 分析完成｜`+

        `官方 ${fmt(official)} 抽｜`+

        `历史 ${history.length} 次｜`+

        `拉长补短：${reversal.label}`;


    $("status").className=
        "muted status good";

}


/* =========================
   当前抽数记录为 SP
========================= */

$("add")
.addEventListener(
    "click",
    ()=>{

        const current =
            Number(
                $("current").value
            );


        if(
            !Number.isFinite(
                current
            )
            ||
            current<=0
        ){

            $("status").textContent=
                "❌ 当前抽数必须大于 0";

            $("status").className=
                "muted status bad";

            return;

        }


        const data =
            getData();


        data.push(
            current
        );


        $("history").value =
            data.join(
                "\n"
            );


        /*
        SP 已经出了

        下一轮重新从 0 开始
        */

        $("current").value=0;


        analyze();

    }
);


/* =========================
   保存
========================= */

$("save")
.addEventListener(
    "click",
    ()=>{

        const data={

            official:
                Number(
                    $("official").value
                ),

            current:
                Number(
                    $("current").value
                ),

            history:
                getData()

        };


        localStorage.setItem(

            "sp_predictor_final",

            JSON.stringify(
                data
            )

        );


        $("status").textContent=
            "✓ 已保存到这台手机的浏览器";

        $("status").className=
            "muted status good";

    }
);


/* =========================
   清除
========================= */

$("clear")
.addEventListener(
    "click",
    ()=>{

        if(
            confirm(
                "确定清除这台手机保存的数据吗？"
            )
        ){

            localStorage.removeItem(
                "sp_predictor_final"
            );


            $("history").value="";

            $("current").value=0;


            $("status").textContent=
                "已清除";

            $("status").className=
                "muted status";

        }

    }
);


/* =========================
   自动读取保存数据
========================= */

try{

    const saved =
        JSON.parse(

            localStorage.getItem(
                "sp_predictor_final"
            )
            ||
            "null"

        );


    if(saved){

        if(
            Number.isFinite(
                saved.official
            )
        ){

            $("official").value=
                saved.official;

        }


        if(
            Number.isFinite(
                saved.current
            )
        ){

            $("current").value=
                saved.current;

        }


        if(
            Array.isArray(
                saved.history
            )
        ){

            $("history").value=
                saved.history.join(
                    "\n"
                );

        }

    }

}catch(e){}


/* =========================
   开始分析按钮
========================= */

$("analyze")
.addEventListener(
    "click",
    analyze
);


})();
</script>

</body>
</html>
